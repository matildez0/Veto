# Lint, formatting and types of the Expo app, on every pull request that touches it
name: Veto app checks

on:
  pull_request:
    paths:
      - 'mvp/veto-app/**'
      - '.github/workflows/veto-app.yml'
  push:
    branches: [main]
    paths:
      - 'mvp/veto-app/**'
      - '.github/workflows/veto-app.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/veto-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mvp/veto-app/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Types
        run: npm run type-check
